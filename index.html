<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dr. Mrinal | Duty App</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@500;700;800&display=swap');

    :root {
      --bg: #fcfbfa;
      --header-bg: #f1f5f9;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --nav-bg: rgba(255, 255, 255, 0.9);
      --accent: #0284c7;
      
      /* Your Requested Color Palette */
      --picu-day-bg: #f3e8ff; --picu-day-txt: #7e22ce;
      --picu-24-bg: #ffe4e6; --picu-24-txt: #e11d48;
      --opd-bg: #e0f2fe; --opd-txt: #0284c7;
      --er-day-bg: #ffedd5; --er-day-txt: #c2410c;
      --off-bg: #dcfce7; --off-txt: #15803d;
      --post-off-bg: #f8fafc; --post-off-txt: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      font-family: 'Nunito', sans-serif; 
      display: flex; justify-content: center; 
      overflow: hidden; height: 100vh; height: 100dvh;
    }

    .app-container {
      width: 100%; max-width: 440px; height: 100%;
      background: radial-gradient(circle at top right, #f8fafc 0%, #fcfbfa 50%, #f1f5f9 100%);
      position: relative; display: flex; flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.04);
    }

    /* Fixed Header */
    header { 
      padding: 55px 24px 20px; 
      background: var(--header-bg);
      border-bottom-left-radius: 32px;
      border-bottom-right-radius: 32px;
      flex-shrink: 0; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
    }
    .greeting { font-family: 'Inter', sans-serif; font-size: 12px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .title { font-size: 26px; font-weight: 800; color: #1e293b; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }

    /* View Container */
    .view-container { 
      flex: 1; position: relative; overflow: hidden; padding: 16px 20px 90px; 
      display: flex; flex-direction: column; min-height: 0;
    }
    
    .tab-content { 
      display: none; opacity: 0; transform: translateY(15px); 
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
      flex: 1; flex-direction: column; min-height: 0; 
    }
    .tab-content.active { display: flex; opacity: 1; transform: translateY(0); }

    /* DAILY VIEW STYLES */
    #view-daily { display: none; flex-direction: column; }
    #view-daily.active { display: flex; }

    #daily-render-area {
      flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 12px; scrollbar-width: none;
    }
    #daily-render-area::-webkit-scrollbar { display: none; }

    .card { background: white; border-radius: 32px; padding: 24px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 2px solid transparent; }
    .card.today { border-color: rgba(2, 132, 199, 0.2); box-shadow: 0 16px 40px rgba(0,0,0,0.06); }
    .card.tomorrow { opacity: 0.85; transform: scale(0.97); margin-top: -8px; padding: 20px 24px; border-radius: 28px; }
    
    .card-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .date-num { font-size: 26px; font-weight: 800; color: var(--text-main); display: block; line-height: 1.1; }
    .day-name { font-size: 15px; color: var(--text-muted); font-weight: 700; }
    
    .badge { padding: 8px 16px; border-radius: 16px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .team-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { background: #f8fafc; color: #475569; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; border: 1px solid #e2e8f0; }
    
    .second-call { margin-top: 16px; padding: 14px 18px; background: #f1f5f9; border-radius: 20px; display: inline-flex; align-items: center; gap: 10px; }
    .second-call-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; }
    .second-call-name { font-size: 14px; font-weight: 800; color: #334155; }

    .daily-note { margin-top: 16px; padding: 14px 18px; background: #fef9c3; border-radius: 20px; border: 2px dashed #fde047; display: flex; gap: 10px; font-size: 14px; font-weight: 700; color: #854d0e; }

    /* Controls permanently at the bottom */
    .controls { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 0 4px 0; background: transparent; z-index: 5; }
    .btn { background: white; border: 1px solid #e2e8f0; padding: 14px 22px; border-radius: 20px; font-size: 15px; font-weight: 800; color: var(--text-main); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); font-family: 'Nunito', sans-serif; }
    .btn:active { transform: scale(0.92); }
    .btn-today { background: var(--accent); color: white; border: none; box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3); }

    /* MONTH VIEW STYLES */
    #view-month { overflow-y: auto; scrollbar-width: none; }
    #view-month::-webkit-scrollbar { display: none; }
    
    .calendar-wrapper { background: white; border-radius: 32px; padding: 16px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
    .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 12px; }
    .cal-header span { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell { height: 64px; padding: 8px 2px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; position: relative; user-select: none; -webkit-user-select: none; }
    .cal-cell:active { transform: scale(0.9); }
    .cal-cell.empty { background: transparent; cursor: default; }
    .cal-cell .cal-date { font-size: 16px; font-weight: 800; }
    .cal-cell .cal-type { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-top: 4px; text-align: center; line-height: 1; }
    
    .note-indicator { position: absolute; top: 4px; right: 4px; font-size: 10px; display: none; }
    .has-note .note-indicator { display: block; }

    /* Duty Pastel Color Mappings */
    .type-picu-day { background: var(--picu-day-bg); color: var(--picu-day-txt); }
    .type-picu-24 { background: var(--picu-24-bg); color: var(--picu-24-txt); }
    .type-opd { background: var(--opd-bg); color: var(--opd-txt); }
    .type-er-day { background: var(--er-day-bg); color: var(--er-day-txt); }
    .type-off { background: var(--off-bg); color: var(--off-txt); }
    .type-post-off { background: var(--post-off-bg); color: var(--post-off-txt); }

    .cal-cell.type-off { border: 2px dashed #86efac; background: #f0fdf4; }

    /* BOTTOM NAV */
    .bottom-nav { position: absolute; bottom: calc(15px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--nav-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 28px; display: flex; padding: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 85%; max-width: 300px; z-index: 20; border: 1px solid rgba(255,255,255,0.8); }
    .nav-item { flex: 1; text-align: center; padding: 12px 0; border-radius: 20px; font-size: 15px; font-weight: 800; color: var(--text-muted); cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; font-family: 'Nunito', sans-serif; }
    .nav-item.active { background: white; color: var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.06); }

    /* NOTE MODAL */
    .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 100; display: none; opacity: 0; transition: opacity 0.3s; justify-content: center; align-items: center; padding: 24px; }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-card { background: white; width: 100%; max-width: 340px; border-radius: 32px; padding: 24px; transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
    .modal-overlay.show .modal-card { transform: scale(1); }
    .modal-header { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .modal-textarea { width: 100%; height: 120px; border: 2px solid #e2e8f0; border-radius: 20px; padding: 16px; font-size: 15px; font-family: 'Nunito', sans-serif; resize: none; margin-bottom: 16px; outline: none; transition: border 0.2s; }
    .modal-textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn { flex: 1; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 800; border: none; cursor: pointer; transition: transform 0.2s; font-family: 'Nunito', sans-serif;}
    .modal-btn:active { transform: scale(0.95); }
    .btn-cancel { background: #f1f5f9; color: #475569; }
    .btn-save { background: var(--accent); color: white; }

    #daily-render-area { transition: opacity 0.2s ease, transform 0.2s ease; }
    .fade-out { opacity: 0; transform: scale(0.96) translateY(10px); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="greeting" id="greetingText">Good Morning,</div>
      <div class="title">🍼 Dr. Mrinal <span style="font-size: 20px;">🩺</span></div>
    </header>

    <div class="view-container">
      
      <!-- DAILY VIEW -->
      <div id="view-daily" class="tab-content active">
        <div id="daily-render-area"></div>
        <div class="controls">
          <button class="btn" onclick="changeDay(-1)">❮ Prev</button>
          <button class="btn btn-today" onclick="goToday()">Today</button>
          <button class="btn" onclick="changeDay(1)">Next ❯</button>
        </div>
      </div>

      <!-- MONTH VIEW -->
      <div id="view-month" class="tab-content">
        <div class="calendar-wrapper">
          <div style="font-weight: 800; text-align: center; margin-bottom: 16px; color: #1e293b;">Ashwin 2083</div>
          <div class="cal-header">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div class="cal-grid" id="calendar-grid"></div>
          <div style="text-align: center; margin-top: 16px; font-size: 13px; color: #64748b; font-weight: 700;">
            💡 Tap date to open • Hold 300ms for note
          </div>
        </div>
      </div>

    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('daily')" id="nav-daily">
        <span>👶</span> Daily
      </div>
      <div class="nav-item" onclick="switchTab('month')" id="nav-month">
        <span>📅</span> Month
      </div>
    </nav>

    <!-- NOTE MODAL -->
    <div class="modal-overlay" id="note-modal">
      <div class="modal-card">
        <div class="modal-header">
          <span id="modal-title">Add Note</span>
          <span>📝</span>
        </div>
        <textarea class="modal-textarea" id="modal-input" placeholder="e.g. Bring stethoscope..."></textarea>
        <div class="modal-actions">
          <button class="modal-btn btn-cancel" onclick="closeNoteModal()">Cancel</button>
          <button class="modal-btn btn-save" onclick="saveNote()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // FULL ROSTER DATA
    const roster = [
      { date: '06-01', day: 'Thu', type: 'picu-day', title: 'PICU Day', team: 'Krishna (NICU), Aayush (PICU), Nischal (ER), Salina (Day ER)', second: 'Prerana' },
      { date: '06-02', day: 'Fri', type: 'opd', title: 'OPD', team: 'Kabita, Madan, Pritha, Samikshya', second: '' },
      { date: '06-03', day: 'Sat', type: 'off', title: 'Saturday OFF', team: 'Public Holiday 🌿', second: '' },
      { date: '06-04', day: 'Sun', type: 'picu-24', title: '24hr PICU', team: 'Kshitiz (NICU), Pritha (ER), Samikshya (Day ER)', second: 'Saurav Stha' },
      { date: '06-05', day: 'Mon', type: 'post-off', title: 'Post Duty', team: 'Enjoy your rest!', second: '' },
      { date: '06-06', day: 'Tue', type: 'opd', title: 'OPD', team: 'Devaki, Kshitiz, Shikha, Pritha', second: '' },
      { date: '06-07', day: 'Wed', type: 'picu-day', title: 'PICU Day', team: 'Shikha (NICU), Srijana (PICU), Salina (ER), Sinda (Day ER)', second: 'Dilip' },
      { date: '06-08', day: 'Thu', type: 'opd', title: 'OPD', team: 'Saurav Singh, Subas, Pritha, Kabita', second: '' },
      { date: '06-09', day: 'Fri', type: 'picu-day', title: 'PICU Day', team: 'Madan (NICU), Aayoush (PICU), Samikshya (ER), Pritha (Day ER)', second: 'Saurav Singh' },
      { date: '06-10', day: 'Sat', type: 'picu-24', title: '24hr PICU', team: 'Subas (NICU), Nischal (ER)', second: 'Krishna' },
      { date: '06-11', day: 'Sun', type: 'post-off', title: 'Post Duty', team: 'Enjoy your rest!', second: '' },
      { date: '06-12', day: 'Mon', type: 'picu-day', title: 'PICU Day', team: 'Sinda (NICU), Srijana (PICU), Salina (ER), Deepmala (Day ER)', second: 'Krishna' },
      { date: '06-13', day: 'Tue', type: 'picu-24', title: '24hr PICU', team: 'Krishna (NICU), Samikshya (ER), Devaki (Day ER)', second: 'Pusp Raj' },
      { date: '06-14', day: 'Wed', type: 'post-off', title: 'Post Duty', team: 'Relax and unwind!', second: '' },
      { date: '06-15', day: 'Thu', type: 'picu-day', title: 'PICU Day', team: 'Madan (NICU), Devaki (PICU), Nischal (ER), Pritha (Day ER)', second: 'Prerana' },
      { date: '06-16', day: 'Fri', type: 'opd', title: 'OPD', team: 'Subas, Aayoush, Deepmala, Kshitiz', second: '' },
      { date: '06-17', day: 'Sat', type: 'off', title: 'Saturday OFF', team: 'Public Holiday 🌿', second: '' },
      { date: '06-18', day: 'Sun', type: 'picu-day', title: 'PICU Day', team: 'Kshitiz (NICU), Srijana (PICU), Salina (ER), Subas (Day ER)', second: 'Saurav Stha' },
      { date: '06-19', day: 'Mon', type: 'er-day', title: 'Day ER', team: 'Saurav Stha (NICU), Aayoush (PICU), Deepmala (ER)', second: 'Krishna' },
      { date: '06-20', day: 'Tue', type: 'opd', title: 'OPD', team: 'Salina, Subas, Kshitiz, Devaki', second: '' },
      { date: '06-21', day: 'Wed', type: 'picu-day', title: 'PICU Day', team: 'Subas (NICU), Kabita (PICU), Samikshya (ER), Kshitiz (Day ER)', second: 'Dilip' },
      { date: '06-22', day: 'Thu', type: 'picu-day', title: 'PICU Day', team: 'Madan (NICU), Prerana (PICU), Sinda (ER), Srijana (Day ER)', second: 'Prerana' },
      { date: '06-23', day: 'Fri', type: 'picu-day', title: 'PICU Day', team: 'Subas (NICU), Devaki (PICU), Nischal (ER), Shikha (Day ER)', second: 'Saurav Singh' },
      { date: '06-24', day: 'Sat', type: 'off', title: 'Saturday OFF', team: 'Public Holiday 🌿', second: '' },
      { date: '06-25', day: 'Sun', type: 'off', title: 'Ghatasthapana', team: 'Public Holiday 🪔', second: '' },
      { date: '06-26', day: 'Mon', type: 'picu-day', title: 'PICU Day', team: 'Krishna (NICU), Kabita (PICU), Pritha (ER), Madan (Day ER)', second: 'Krishna' },
      { date: '06-27', day: 'Tue', type: 'picu-day', title: 'PICU Day', team: 'Madan (NICU), Kabita (PICU), Samikshya (ER), Sinda (Day ER)', second: 'Pusp Raj' },
      { date: '06-28', day: 'Wed', type: 'opd', title: 'OPD', team: 'Prerana, Sinda, Shikha, Subas', second: '' },
      { date: '06-29', day: 'Thu', type: 'picu-day', title: 'PICU Day', team: 'Subas (NICU), Prerana (PICU), Salina (ER), Srijana (Day ER)', second: 'Prerana' },
      { date: '06-30', day: 'Fri', type: 'picu-24', title: '24hr PICU', team: 'Sinda (NICU), Deepmala (ER), Pritha (Day ER)', second: 'Saurav Singh' },
      { date: '06-31', day: 'Sat', type: 'post-off', title: 'Post Duty', team: 'Weekend recovery ☕', second: '' }
    ];

    const notesDB = JSON.parse(localStorage.getItem('mrinalDutyNotes')) || {};
    const rosterStartDate = new Date('2026-09-17T00:00:00'); // Ashwin 1
    let realTodayIndex = 0;
    let currentIndex = 0;
    let activeNoteDate = null;

    function initData() {
      const now = new Date();
      const diffTime = now - rosterStartDate;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays >= 0 && diffDays < roster.length) { realTodayIndex = diffDays; }
      
      const hour = now.getHours();
      let greeting = 'Good Evening,';
      if(hour < 12) greeting = 'Good Morning,';
      else if(hour < 17) greeting = 'Good Afternoon,';
      document.getElementById('greetingText').innerText = greeting;
    }

    function generateCard(data, type) {
      if(!data) return '';
      const isMain = type === 'today';
      const pills = data.team.split(', ').map(member => `<span class="pill">${member}</span>`).join('');
      const secondCallHtml = data.second 
        ? `<div class="second-call"><span class="second-call-label">📞 2nd Call</span><span class="second-call-name">${data.second}</span></div>` 
        : '';
      
      const savedNote = notesDB[data.date];
      const noteHtml = savedNote 
        ? `<div class="daily-note"><span>📝</span><span>${savedNote}</span></div>` 
        : '';
      
      return `
        <div class="card ${isMain ? 'today' : 'tomorrow'} type-${data.type}">
          <div class="card-label">${isMain ? 'Main View • Selected Day' : 'Next Day Overview'}</div>
          <div class="card-header">
            <div>
              <span class="date-num">Ashwin ${data.date.split('-')[1]}</span>
              <span class="day-name">${data.day}</span>
            </div>
            <div class="badge type-${data.type}">${data.title}</div>
          </div>
          <div>
            <div class="team-label">Teammates</div>
            <div class="pills">${pills}</div>
          </div>
          ${secondCallHtml}
          ${noteHtml}
        </div>
      `;
    }

    function renderDailyView() {
      const renderArea = document.getElementById('daily-render-area');
      renderArea.classList.add('fade-out');
      
      setTimeout(() => {
        const mainData = roster[currentIndex];
        const subData = roster[currentIndex + 1] || null;
        
        let html = generateCard(mainData, 'today');
        if(subData) {
          html += generateCard(subData, 'tomorrow');
        } else {
          html += `<div class="card tomorrow"><div class="card-label">End of Roster</div><div class="team-label">No duties left for Ashwin 2083.</div></div>`;
        }
        
        renderArea.innerHTML = html;
        renderArea.classList.remove('fade-out');
      }, 100);
    }

    function renderMonthView() {
      const grid = document.getElementById('calendar-grid');
      let html = '';
      
      for(let i=0; i<4; i++) { html += `<div class="cal-cell empty"></div>`; }
      
      roster.forEach((day, index) => {
        let titleAbbr = day.title.replace(' Day', '').replace(' OFF', '').substring(0,6);
        const hasNoteClass = notesDB[day.date] ? 'has-note' : '';
        
        html += `
          <div class="cal-cell type-${day.type} ${hasNoteClass}" 
               data-index="${index}" data-date="${day.date}">
            <span class="cal-date">${day.date.split('-')[1]}</span>
            <span class="cal-type">${titleAbbr}</span>
            <span class="note-indicator">📝</span>
          </div>
        `;
      });
      grid.innerHTML = html;
      attachCalendarInteractions();
    }

    function attachCalendarInteractions() {
      document.querySelectorAll('.cal-cell:not(.empty)').forEach(cell => {
        let pressTimer = null;
        let isLongPress = false;
        let startX = 0;
        let startY = 0;

        const startPress = (e) => {
          isLongPress = false;
          if (e.type === 'contextmenu') e.preventDefault();
          
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX;
          startY = touch.clientY;

          pressTimer = setTimeout(() => {
            isLongPress = true;
            if (navigator.vibrate) navigator.vibrate(50);
            openNoteModal(cell.dataset.date);
          }, 300);
        };

        const movePress = (e) => {
          if (!pressTimer) return;
          const touch = e.touches ? e.touches[0] : e;
          const moveX = Math.abs(touch.clientX - startX);
          const moveY = Math.abs(touch.clientY - startY);
          
          if (moveX > 10 || moveY > 10) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        };

        const endPress = (e) => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
          if (!isLongPress) {
            jumpToDate(cell.dataset.index);
          }
        };

        cell.addEventListener('touchstart', startPress, { passive: true });
        cell.addEventListener('touchmove', movePress, { passive: true });
        cell.addEventListener('touchend', endPress);
        
        cell.addEventListener('mousedown', startPress);
        cell.addEventListener('mousemove', movePress);
        cell.addEventListener('mouseup', endPress);
        cell.addEventListener('mouseleave', () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        });
        cell.addEventListener('contextmenu', e => e.preventDefault());
      });
    }

    function openNoteModal(dateKey) {
      activeNoteDate = dateKey;
      document.getElementById('modal-title').innerText = `Ashwin ${dateKey.split('-')[1]}`;
      document.getElementById('modal-input').value = notesDB[dateKey] || '';
      document.getElementById('note-modal').classList.add('show');
      setTimeout(() => document.getElementById('modal-input').focus(), 300);
    }

    function closeNoteModal() {
      document.getElementById('note-modal').classList.remove('show');
      activeNoteDate = null;
    }

    function saveNote() {
      const val = document.getElementById('modal-input').value.trim();
      if (val === '') { delete notesDB[activeNoteDate]; } 
      else { notesDB[activeNoteDate] = val; }
      
      localStorage.setItem('mrinalDutyNotes', JSON.stringify(notesDB));
      closeNoteModal();
      renderMonthView();
      renderDailyView();
    }

    function changeDay(step) {
      const newIndex = currentIndex + step;
      if(newIndex >= 0 && newIndex < roster.length) {
        currentIndex = newIndex;
        renderDailyView();
        document.getElementById('daily-render-area').scrollTo(0,0);
      }
    }
    
    function goToday() {
      if(currentIndex !== realTodayIndex) {
        currentIndex = realTodayIndex;
        renderDailyView();
        document.getElementById('daily-render-area').scrollTo(0,0);
      }
    }
    
    function jumpToDate(index) {
      currentIndex = parseInt(index);
      switchTab('daily');
    }
    
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`view-${tabId}`).classList.add('active');
      document.getElementById(`nav-${tabId}`).classList.add('active');
      
      if(tabId === 'daily') {
        renderDailyView();
      }
    }

    initData();
    currentIndex = realTodayIndex;
    renderDailyView();
    renderMonthView();
  </script>
</body>
</html>
